[package]
name = "openai-responses-api"
version = "0.1.0"
edition = "2024"
description = "Typed client for the OpenAI Responses API: input and output items, HTTP client, SSE event stream"
license = "0BSD"
readme = "README.md"
repository = "https://github.com/ZmoleCristian/openai-responses-api"
keywords = ["openai", "responses", "llm", "codex", "sse"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
eventsource-stream = "0.2.3"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "stream", "charset", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
futures = "0.3.34"
